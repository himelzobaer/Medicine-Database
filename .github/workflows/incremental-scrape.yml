name: Incremental Detail Scrape (Cloud Worker)

on:
  schedule:
    # Triggers at the 10th minute, but actual scraping starts randomly between 10-18 mins due to sleep!
    - cron: '10 */2 * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to push changes back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Organic Delay (Anti-Bot Detection)
        # Sleeps for a random time between 1 and 480 seconds (up to 8 mins) before starting!
        run: sleep $((RANDOM % 480 + 1))

      - name: Run Detail Scrape (45 mins limit)
        # Runs for 45 minutes to give the target server a solid 75-min cool-down period
        run: pnpm run scrape:detail --time-limit=45

      - name: Export Data
        run: pnpm run export:all

      - name: Commit and push changes
        run: |
          git config --global user.name "Medicine Bot"
          git config --global user.email "bot@medicine-db.com"
          git add data/
          # If there are changes, commit and push them
          git diff --staged --quiet || git commit -m "chore(data): incremental detail scrape progress [skip ci]"
          git push
